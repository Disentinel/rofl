<svg xmlns="http://www.w3.org/2000/svg" class="rofl-pic" viewBox="0 0 680 283" width="100%" role="img" aria-label="space"><style>
.rofl-pic { --p-fg: var(--vscode-editor-foreground, var(--fg, #1c2120)); --p-mute: var(--vscode-descriptionForeground, var(--mute, #66706b));
  --p-line: var(--vscode-panel-border, var(--line, #d9ddd6)); --p-bg: var(--vscode-editor-background, var(--code-bg, #fcfcfa)); --p-panel: var(--vscode-editorWidget-background, var(--panel, #fff));
  --p-soft: var(--vscode-editor-inactiveSelectionBackground, var(--soft, #eef0eb)); --p-accent: var(--vscode-focusBorder, var(--accent, #1d4ed8)); --p-accent-bg: color-mix(in srgb, var(--p-accent) 12%, transparent);
  --p-fail: var(--vscode-errorForeground, var(--fail, #b91c1c)); --p-fail-bg: color-mix(in srgb, var(--p-fail) 12%, transparent);
  --p-warn: var(--vscode-editorWarning-foreground, var(--warn, #a15c07)); --p-warn-bg: color-mix(in srgb, var(--p-warn) 14%, transparent); --p-pass: var(--vscode-testing-iconPassed, var(--pass, #047857));
  --p-mono: var(--vscode-editor-font-family, var(--mono, ui-monospace, Menlo, monospace));
  border: 1px solid var(--p-line); border-radius: 5px; background: var(--p-bg); color: var(--p-fg); min-width: 0; }
.rofl-pic .pbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 8px; border-bottom: 1px solid var(--p-line); font: 12px/1.4 var(--p-mono); color: var(--p-mute); }
.rofl-pic .pbar .spacer { flex: 1; }
.rofl-pic button { font: 12px/1 inherit; padding: 4px 8px; color: var(--p-fg); background: var(--p-panel); border: 1px solid var(--p-line); border-radius: 4px; cursor: pointer; }
.rofl-pic .stage { overflow-x: auto; }
.rofl-pic .cy { height: 380px; }
.rofl-pic .frame { border-top: 1px dashed var(--p-line); }
.rofl-pic .frame-key { padding: 4px 8px; font: 12px var(--p-mono); }
.rofl-pic .frame .cy { height: 260px; }
.rofl-pic .detail { padding: 8px 10px; border-top: 1px solid var(--p-line); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.rofl-pic .detail pre, .rofl-pic .why { margin: 0; padding: 6px 8px; background: var(--p-panel); border: 1px solid var(--p-line); border-radius: 4px; font: 12px/1.5 var(--p-mono); white-space: pre-wrap; }
.rofl-pic .facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.rofl-pic .facts code { font: 12.5px var(--p-mono); }
.rofl-pic .mute { color: var(--p-mute); }
.rofl-pic .note { color: var(--p-warn); background: var(--p-warn-bg); padding: 5px 10px; font-size: 13px; }
.rofl-pic details.as { padding: 4px 10px 8px; font-size: 12.5px; color: var(--p-mute); }
.rofl-pic details.as pre, .rofl-pic pre.fallback { margin: 6px 0 0; padding: 8px 10px; font: 12px/1.5 var(--p-mono); white-space: pre; overflow-x: auto; color: var(--p-fg); }
.rofl-pic .tag { font: 11px var(--p-mono); padding: 1px 6px; border-radius: 3px; background: var(--p-soft); color: var(--p-mute); }
.rofl-pic table.view { border-collapse: collapse; margin: 8px; font: 12.5px var(--p-mono); }
.rofl-pic table.view th, .rofl-pic table.view td { border: 1px solid var(--p-line); padding: 4px 9px; text-align: left; }
.rofl-pic [data-mark], .rofl-pic [data-group] { cursor: pointer; }
.rofl-pic text[data-group] { text-decoration: underline dotted; }
.rofl-pic { display: block; }
.rofl-pic text { font: 11px var(--p-mono); fill: var(--p-fg); }
.rofl-pic .axis text { fill: var(--p-mute); }
.rofl-pic .axis line, .rofl-pic .lanes line { stroke: var(--p-line); }
.rofl-pic [data-mark] { fill: var(--p-accent-bg); stroke: var(--p-accent); stroke-width: 1.2; }
.rofl-pic line[data-mark] { stroke-width: 1.6; }
.rofl-pic .failing, .rofl-pic .dangling, .rofl-pic .failing, .rofl-pic .dangling { color: var(--p-fail); background: var(--p-fail-bg); fill: var(--p-fail-bg); stroke: var(--p-fail); }
.rofl-pic .dangling, .rofl-pic .dangling { border-style: dashed; stroke-dasharray: 4 3; }
.rofl-pic .blind { background: repeating-linear-gradient(45deg, var(--p-warn-bg), var(--p-warn-bg) 4px, transparent 4px, transparent 8px); }
.rofl-pic .blind { fill: url(#rofl-hatch); stroke: var(--p-warn); stroke-dasharray: 5 3; }
.rofl-pic .unknown, .rofl-pic .unknown { color: var(--p-mute); stroke: var(--p-mute); stroke-dasharray: 2 3; }
.rofl-pic .gone, .rofl-pic .gone { opacity: .45; text-decoration: line-through; stroke-dasharray: 5 5; }
.rofl-pic .new { outline: 2px solid var(--p-pass); outline-offset: -2px; }
.rofl-pic .new { stroke: var(--p-pass); stroke-width: 3; }
.rofl-pic .region { fill: var(--p-soft); fill-opacity: .5; stroke: var(--p-mute); }
.rofl-pic line.link { stroke: var(--p-mute); stroke-width: 1.5; }
.rofl-pic .collapsed { stroke-width: 3; }</style><defs><pattern id="rofl-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--p-warn-bg)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--p-warn)" stroke-width="2"/></pattern></defs><g class="axis"><line x1="186.6" x2="186.6" y1="12" y2="271"/><text x="188.6" y="279">0°</text></g><g class="axis"><line x1="367.26666666666665" x2="367.26666666666665" y1="12" y2="271"/><text x="369.26666666666665" y="279">10°</text></g><g class="axis"><line x1="547.9333333333333" x2="547.9333333333333" y1="12" y2="271"/><text x="549.9333333333333" y="279">20°</text></g><g class="axis"><line x1="12" x2="668" y1="240.93333333333334" y2="240.93333333333334"/><text x="2" y="238.93333333333334">40°</text></g><g class="axis"><line x1="12" x2="668" y1="60.26666666666668" y2="60.26666666666668"/><text x="2" y="58.26666666666668">50°</text></g><line data-mark="berlin" class="link " x1="421.46666666666664" y1="24.133333333333326" x2="439.5333333333333" y2="60.26666666666668"/><line data-mark="berlin" class="link " x1="421.46666666666664" y1="24.133333333333326" x2="566" y2="24.133333333333326"/><line data-mark="madrid" class="link " x1="114.33333333333333" y1="240.93333333333334" x2="24" y2="259"/><line data-mark="paris" class="link " x1="222.73333333333332" y1="78.33333333333334" x2="421.46666666666664" y2="24.133333333333326"/><line data-mark="paris" class="link " x1="222.73333333333332" y1="78.33333333333334" x2="114.33333333333333" y2="240.93333333333334"/><line data-mark="prague" class="link " x1="439.5333333333333" y1="60.26666666666668" x2="475.6666666666667" y2="96.4"/><circle data-mark="berlin" data-at="13 52" class="" cx="421.46666666666664" cy="24.133333333333326" r="6"><title>berlin</title></circle><text x="430.46666666666664" y="28.133333333333326" pointer-events="none">berlin</text><circle data-mark="lisbon" data-at="-9 39" class="" cx="24" cy="259" r="6"><title>lisbon</title></circle><text x="33" y="263" pointer-events="none">lisbon</text><circle data-mark="madrid" data-at="-4 40" class="" cx="114.33333333333333" cy="240.93333333333334" r="6"><title>madrid</title></circle><text x="123.33333333333333" y="244.93333333333334" pointer-events="none">madrid</text><circle data-mark="paris" data-at="2 49" class="" cx="222.73333333333332" cy="78.33333333333334" r="6"><title>paris</title></circle><text x="231.73333333333332" y="82.33333333333334" pointer-events="none">paris</text><circle data-mark="prague" data-at="14 50" class="" cx="439.5333333333333" cy="60.26666666666668" r="6"><title>prague</title></circle><text x="448.5333333333333" y="64.26666666666668" pointer-events="none">prague</text><circle data-mark="rome" data-at="12 42" class="stranded failing" cx="403.4" cy="204.8" r="6"><title>rome</title></circle><text x="412.4" y="208.8" pointer-events="none">rome</text><circle data-mark="vienna" data-at="16 48" class="" cx="475.6666666666667" cy="96.4" r="6"><title>vienna</title></circle><text x="484.6666666666667" y="100.4" pointer-events="none">vienna</text><circle data-mark="warsaw" data-at="21 52" class="" cx="566" cy="24.133333333333326" r="6"><title>warsaw</title></circle><text x="575" y="28.133333333333326" pointer-events="none">warsaw</text></svg>
