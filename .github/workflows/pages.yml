name: Pages

# The notebook page, the playground and the guide as one static site: built on every push and pull request, so a break shows
# before a merge; published from main to GitHub Pages (Settings, Pages, Source: GitHub Actions).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          node --experimental-strip-types scripts/workbench.ts --out _site --standalone
          node --experimental-strip-types scripts/playground.ts --out _site/playground --standalone
          node --experimental-strip-types scripts/guide_site.ts --out _site/guide
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with: { path: _site }

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
