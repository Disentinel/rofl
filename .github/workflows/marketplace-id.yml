# one-off: prints the Marketplace id of the managed identity, to add to the publisher's Members; deleted before merge
on: { push: { branches: [claude/marketplace-publish-gz788g] } }
permissions: { id-token: write, contents: read }
jobs:
  id:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with: { client-id: '${{ secrets.AZURE_CLIENT_ID }}', tenant-id: '${{ secrets.AZURE_TENANT_ID }}', allow-no-subscriptions: true }
      - run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
