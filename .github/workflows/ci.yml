name: CI

on:
  push:
  pull_request:

# ONE RUN PER REF. Without this every push starts a run and nothing stops the
# one it superseded, so six pushes to a branch in forty minutes leave six live
# runs doing the same work — measured 2026-09-09: six concurrent in_progress
# runs, the oldest 44 minutes in, one earlier run 1h01m. The node suite is
# 19m43s of wall on its own, so a jammed queue is the default rather than the
# accident. A superseded run's verdict is about a tree nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # THE GRAVES NEED HISTORY. `removed_in(Path, Sha)` is checked by
        # `git cat-file -e <sha>^:<path>`, and a depth-1 checkout has no parent
        # tree to look in — which made every grave unverifiable and CI red on
        # six consecutive pushes before anybody looked at CI.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: typecheck
        run: |
          npm ci
          npx tsc -p tsconfig.json
      # THE GOLDENS RUN THE RUST ENGINE. `npm test` and goldens.ts spawn
      # rust/target/release binaries; CI built none, so bun died on ENOENT.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cd rust && cargo build --release
      # THE KEEP, AND WHERE IT IS NOT TRUSTED. `npm test` reads back a world's answer kept under the hash of everything
      # it is a function of (scripts/keep.ts), so a pull request runs warm on the keep of earlier runs. A wrongly kept
      # answer that equals the golden would turn a real regression green, so a push to main and a release tag run COLD,
      # with nothing restored: the truth before a merge lands and before a release. Every run saves what it computed.
      - if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rofl-nb-')))"
        uses: actions/cache/restore@v4
        with: { path: .cache/rofl, key: 'rofl-keep-${{ github.sha }}', restore-keys: rofl-keep- }
      - name: goldens (node)
        # the pool's default is the cores less two: one worker on a small runner
        env: { ROFL_JOBS: 4 }
        run: npm test
      - if: success() || failure()
        uses: actions/cache/save@v4
        with: { path: .cache/rofl, key: 'rofl-keep-${{ github.sha }}-${{ github.run_attempt }}' }
      # THE NPM PACKAGES, AS A USER GETS THEM. @grafema/rofl and @grafema/rofl-linux-x64 packed with this job's engine,
      # installed from the tarballs alone into an empty prefix, HOME and npm cache with no registry, and run outside the
      # tree: rofl ask, rofl scan and the JS model, a kept world, rofl-nb, the library, and the faults that must be loud.
      # On main and a tag the vsix job runs the same check on the engine job's binaries.
      - name: npm packages
        run: |
          (cd vscode && npm ci)
          node --experimental-strip-types scripts/dist.ts
          node --experimental-strip-types scripts/npm_check.ts

  # EVERY PLATFORM COMPILES BEFORE A MERGE. The engine job below builds each platform on main and on a tag only, so
  # a pull request that breaks one is green until it lands: bin/rofl/kept.rs called statvfs and kill, and win32 was
  # red on main for five merges and blocked the 1.4.0 release. A cargo check per target, on every push and pull
  # request, says so first. Each runs where its C compiler is, since the bundled SQLite of the sql adapter is C:
  # msvc on Windows, darwin on macOS, windows-gnu on Linux with mingw.
  platforms:
    strategy:
      matrix:
        include:
          - { triple: x86_64-pc-windows-msvc, os: windows-latest }
          - { triple: x86_64-pc-windows-gnu, os: ubuntu-latest, apt: gcc-mingw-w64-x86-64 }
          - { triple: x86_64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.triple }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, key: 'platforms-${{ matrix.triple }}' }
      - if: matrix.apt
        run: sudo apt-get install -y ${{ matrix.apt }}
      - run: cd rust && cargo check --release --target ${{ matrix.triple }} --bins

  # THE EXTENSION CARRIES THE RUST ENGINE. One `rofl` binary per platform VS Code
  # publishes for, then one VSIX per platform with its binary in rofl-nb/bin: the
  # extension evaluates on it by default (playground/rust.ts), and a platform
  # without one falls back to the TypeScript engine. Built on main and on a release
  # tag only: a branch's binaries ship nowhere, and main still finds a platform's break
  # before a release does.
  engine:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rofl-nb-'))
    strategy:
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-x64, os: macos-14, triple: x86_64-apple-darwin }
          - { target: darwin-arm64, os: macos-14 }
          - { target: win32-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.triple }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, key: '${{ matrix.target }}' }
      - run: cd rust && cargo build --release --bin rofl ${{ matrix.triple && format('--target {0}', matrix.triple) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: rofl-${{ matrix.target }}
          path: rust/target/${{ matrix.triple && format('{0}/', matrix.triple) || '' }}release/rofl${{ startsWith(matrix.target, 'win32') && '.exe' || '' }}

  vsix:
    needs: engine
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rofl-nb-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # dist checks each README image against the pushed branches
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && (cd vscode && npm ci)
      # each platform's engine in rust/target/rofl-<target>; this runner's own in release, which the guide check runs
      - uses: actions/download-artifact@v4
        with: { path: rust/target }
      - name: one VSIX per platform
        run: |
          chmod +x rust/target/rofl-*/rofl*
          mkdir -p rust/target/release vsix && cp rust/target/rofl-linux-x64/rofl rust/target/release/
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            node --experimental-strip-types scripts/dist.ts --target $t
            unzip -l dist/*.vsix | grep -q "extension/rofl-nb/bin/rofl" || { echo "the $t VSIX carries no engine"; exit 1; }
            for f in dist/*.vsix; do mv "$f" "vsix/$(basename "$f" .vsix)-$t.vsix"; done
          done
          node --experimental-strip-types scripts/dist.ts && mv dist/*.tgz vsix/
      # the npm packages as packed for release, the linux-x64 engine among them, installed and run as a user would
      - run: node --experimental-strip-types scripts/npm_check.ts --dist vsix
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: vsix }

  # THE RELEASE, REHEARSED ON MAIN. The release job runs only on a tag, so nothing else ran its publishing: the 1.5.0 tag
  # failed on `mkdir out npm` against the tree's own npm/ (#126). This runs scripts/release_publish.sh, the release job's
  # own, over this run's artifacts with --dry-run: no GitHub release, `npm stage publish --dry-run`; and, in the release's
  # environment with an id token, npm's sign-in by trusted publishing for each package (scripts/npm_oidc.ts), which the
  # 1.5.1 tag failed on (ENEEDAUTH). Only a push to main and a tag may use that environment (docs/npm.md: its branch policy).
  release-dry:
    needs: vsix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: npm install -g npm@12.2.1
      - run: bash scripts/release_publish.sh --dry-run "rofl-nb-$(node -p "require('./package.json').version")"

  # A TAG rofl-nb-<version> IS A RELEASE, made only when every gate is green on it:
  # the engine per platform, a VSIX per platform, their sha256, and
  # docs/releases/<major.minor>.md as the notes; and the npm packages
  # (@grafema/rofl and @grafema/rofl-<os>-<cpu>) to the registry, not to the
  # GitHub release. A tag whose version is not package.json's, or not every npm
  # tarball's, is refused first.
  release:
    if: startsWith(github.ref, 'refs/tags/rofl-nb-')
    needs: [node, vsix]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    environment: marketplace-publish
    env: { AZURE_CLIENT_ID: '${{ secrets.AZURE_CLIENT_ID }}', OVSX_PAT: '${{ secrets.OVSX_PAT }}' }
    steps:
      - uses: actions/checkout@v4
      # no registry-url: an NODE_AUTH_TOKEN, even empty, would stop npm from signing in by OIDC
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      # the GitHub release, then the npm packages staged on the registry, each platform's first and @grafema/rofl last, for the owner to
      # approve in that order; signed in by trusted publishing (OIDC, no token kept), with provenance. The npm packages only when the
      # repository variable NPM_PUBLISH is true (docs/npm.md). release-dry runs the same script on main.
      - run: npm install -g npm@12.2.1
      - name: publish
        env: { GH_TOKEN: '${{ github.token }}', NPM_PUBLISH: '${{ vars.NPM_PUBLISH }}' }
        run: bash scripts/release_publish.sh "$GITHUB_REF_NAME"
      # the same VSIX files to the VS Code Marketplace, signed in as the managed identity of AZURE_CLIENT_ID (Entra ID, no token kept), and to Open VSX with OVSX_PAT; each only when its secret is set, and a version already there is skipped
      - if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with: { client-id: '${{ env.AZURE_CLIENT_ID }}', tenant-id: '${{ secrets.AZURE_TENANT_ID }}', allow-no-subscriptions: true }
      - if: env.AZURE_CLIENT_ID != ''
        run: npx -y @vscode/vsce@4 publish --skip-duplicate --azure-credential --packagePath out/*-*-*.vsix
      - if: env.OVSX_PAT != ''
        run: npx -y ovsx@1 publish --skip-duplicate --packagePath out/*-*-*.vsix
