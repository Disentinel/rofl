name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: kernel grep test (vocabulary check)
        run: npm run grepcheck
      - name: typecheck
        run: |
          npm ci
          npx tsc -p tsconfig.json
      - name: tests (node --test)
        run: npm test

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: kernel grep test (vocabulary check)
        run: bun scripts/kernel_grep.ts
      - name: install dependencies (the scanner needs @babel/parser)
        run: bun install
      - name: tests (bun test)
        run: bun test --timeout 60000
