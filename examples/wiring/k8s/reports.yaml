apiVersion: v1
kind: Service
metadata:
  name: reports-svc
spec:
  selector:
    app: reports
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
spec:
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
        - name: app
          image: reports-rust:1.0
          ports:
            - containerPort: 9000
          args:
            - "--listen"
            - ":9000"
            - "--orders-url"
            - "http://api.internal/orders"
