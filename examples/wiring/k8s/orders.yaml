apiVersion: v1
kind: Service
metadata:
  name: orders-svc
spec:
  selector:
    app: orders
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: app
          image: orders-node:1.0
          ports:
            - containerPort: 8080
          env:
            - name: BILLING_URL
              value: "http://api.internal/billing"
