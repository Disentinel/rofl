upstream orders_up  { server orders-svc:8080; }
upstream billing_up { server billing-svc:8081; }
upstream reports_up { server reports-svc:9000; }

server {
  listen 80;
  server_name api.internal;

  location /orders  { proxy_pass http://orders_up; }
  location /billing { proxy_pass http://billing_up; }
  location /reports { proxy_pass http://reports_up; }
}
