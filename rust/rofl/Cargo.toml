[package]
name = "rofl"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
serde = "1"
serde_json = "1"
memmap2 = "0.9"
regex = "1"
# the free space of a disk, before a question verb keeps its world on it (src/bin/rofl/kept.rs)
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# planted faults for scripts/agg_breaks.ts (src/breaks.rs); never in a normal build
[features]
breaks = []

[lib]
name = "rofl"
path = "src/lib.rs"

[[bin]]
name = "rofl"
path = "src/bin/rofl/main.rs"
