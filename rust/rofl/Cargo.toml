[package]
name = "grafema-rofl"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "ROFL — Relation-Oriented Fixpoint Language: a Datalog-family engine with perspectives, explicit time, kernel-emitted provenance and budgets-as-semantics"
license = "MIT"
repository = "https://github.com/Disentinel/rofl"
homepage = "https://github.com/Disentinel/rofl"
readme = "README.md"
keywords = ["datalog", "inference", "fixpoint", "provenance", "logic"]
categories = ["database-implementations"]
# The gates are the repository's, not the crate's: they read `boot.rofl`, the
# generated conformance corpus and the release binaries, none of which exist
# beside a packaged crate. Shipping them would ship four files that cannot
# compile.
exclude = ["tests/*"]

[dependencies]
serde_json = "1"

[lib]
name = "rofl"
path = "src/lib.rs"

[[bin]]
name = "rofl-eval"
path = "src/bin/rofl_eval.rs"

[[bin]]
name = "ring1-lex"
path = "src/bin/ring1_lex.rs"

[[bin]]
name = "ring1-preds"
path = "src/bin/ring1_preds_dump.rs"

[[bin]]
name = "ring1-tokens"
path = "src/bin/ring1_tokens_dump.rs"

[[bin]]
name = "rofl-lex"
path = "src/bin/rofl_lex_dump.rs"

[[bin]]
name = "rofl-parse"
path = "src/bin/rofl_parse_dump.rs"

[[bin]]
name = "rofl-parse-bench"
path = "src/bin/rofl_parse_bench.rs"

[[bin]]
name = "rofl-session-bench"
path = "src/bin/rofl_session_bench.rs"

[[bin]]
name = "rofl-serve"
path = "src/bin/rofl_serve.rs"

[[bin]]
name = "rofl-load"
path = "src/bin/rofl_load_dump.rs"

[[bin]]
name = "rofl-load-bench"
path = "src/bin/rofl_load_bench.rs"
